name: GitHub Actions Lint

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.4

      - name: Install linters
        env:
          GOBIN: ${{ runner.temp }}/go-bin
        run: |
          mkdir -p "$GOBIN"
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
          go install github.com/suzuki-shunsuke/ghalint/cmd/ghalint@v1.5.5
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Run actionlint
        run: actionlint -shellcheck shellcheck

      - name: Run ghalint
        run: ghalint run
