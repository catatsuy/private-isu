log_format ltsv "time:$time_local"
  "\thost:$remote_addr"
  "\tforwardedfor:$http_x_forwarded_for"
  "\treq:$request"
  "\tstatus:$status"
  "\tmethod:$request_method"
  "\turi:$request_uri"
  "\tsize:$body_bytes_sent"
  "\treferer:$http_referer"
  "\tua:$http_user_agent"
  "\treqtime:$request_time"
  "\tapptime:$upstream_response_time"
  "\tvhost:$host";

# アップストリームへの接続を使い回す。
# 毎リクエスト新規接続だと1リクエストにつきポートを1個消費し、TIME_WAIT が
# 60秒間ポートを掴んだままになる。60秒のベンチでエフェメラルポート
# (32768-60999 / 28231個) を使い切ると connect() が
# (99: Cannot assign requested address) で失敗し 502 になる。
upstream app {
  server app:8080;
  keepalive 64;
}

server {
  listen 80;

  # server レベルで指定して nginx.conf の combined ログを上書きする
  access_log /var/log/nginx/access.log ltsv;

  client_max_body_size 10m;
  root /public/;

  location / {
    proxy_set_header Host $host;
    proxy_pass http://app;
  }
}
